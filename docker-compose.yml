services:
  futhorc:
    image: ghcr.io/pekempy/futhorc:latest
    container_name: futhorc_app
    restart: unless-stopped
    ports:
      - "7863:80"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      # Read at runtime by server.mjs and handed to the browser via
      # /api/config, so changing these needs a restart, not a rebuild.
      #
      # Note: anything named VITE_* is inlined by Vite at *build* time, so
      # setting one here has no effect on an already-built image. That's why
      # these two are plain names and go through /api/config instead.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
